name: CD - Desplegar a Render

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Desplegar en Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Setup de Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Instalar dependencias y correr pruebas
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: Trigger Render Deploy
        env:
          DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -f -X POST "$DEPLOY_URL"
          echo "Despliegue iniciado! Revisa: https://dashboard.render.com"
