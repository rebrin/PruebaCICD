# .github/workflows/cd.yml
name: CD - Desplegar a Render

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Desplegar en Render
    runs-on: ubuntu-latest

    steps:
      # Opcional pero recomendado: corre las pruebas antes de desplegar
      - name: Checkout código
        uses: actions/checkout@v7
      - name: Instalar dependencias
        uses: pnpm/action-setup@v6

      - name: setup de node
      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: instalar pnpm    
        -run: pnpm install --frozen-lockfile
        -run: pnpm test

      # Este es el paso mágico que despliega en Render
      - name: Trigger Render Deploy
        env:
          DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -X POST "$DEPLOY_URL"
          echo "Despliegue iniciado! Revisa: https://dashboard.render.com"
